[package]
name = "gnawtreewriter"
version = "0.26.0"
edition = "2021"
authors = ["gnaw Software"]
description = "Tree-based code editor for LLM-assisted editing"
repository = "https://github.com/gnawSoftware/GnawTreeWriter"
license = "MPL-2.0"
readme = "README.md"
keywords = ["code-editor", "tree-sitter", "AST", "LLM", "code-generation"]
categories = ["development-tools", "parser-implementations"]

[[bin]]
name = "gnawtreewriter"
path = "src/main.rs"

# Needs ModernBERT/candle — skip under --no-default-features (Motor2
# regression: cargo check --no-default-features --all-targets must pass).
[[example]]
name = "debug_loading"
required-features = ["modernbert"]

[dependencies]
tree-sitter = "0.26.3"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-php = "0.24.2"
tree-sitter-html = "0.23.2"
tree-sitter-go = "0.25.0"
tree-sitter-c = "0.24.1"
tree-sitter-cpp = "0.23.4"
tree-sitter-bash = "0.25.1"
tree-sitter-java = "0.23.5"
tree-sitter-zig = "1.1.2"
tree-sitter-slint = "0.24.0"
tree-sitter-kotlin = { package = "tree-sitter-kotlin-ng", version = "1.1.0" }
tree-sitter-swift = "0.7.1"

serde = { version = "1.0", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
anyhow = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }
regex = "1.10"
walkdir = "2.5"
ignore = "0.4"
reqwest = { version = "0.11", features = ["json", "rustls-tls"], optional = true }
similar = { version = "2.5", features = ["inline"] }
tree-sitter-javascript = "0.25.0"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-dart = "0.1.0"
tree-sitter-svelte-next = "0.1.1"
tree-sitter-sequel = "0.3.11"
tree-sitter-qmljs = "0.3.0"
# Verified build+parse against tree-sitter 0.26.13 (probe /tmp/gtw-lang-probe).
# dockerfile was rejected: tree-sitter-dockerfile 0.2.0 exports no `LANGUAGE`
# and pulls a second runtime (0.20.10) -> unusable without a rewrite.
tree-sitter-powershell = "0.26.6"
tree-sitter-cmake = "0.7.6"
tree-sitter-make = "1.1.1"
tree-sitter-ruby = "0.23.1"
# Document/config formats: replace the position-blind serde/regex parsers.
# Their nodes carried no byte spans (start_col/end_col were 0), so edit_node
# fell back to whole-line replacement: a CSS declaration value replaced its
# whole rule, a markdown heading lost its '#', a paragraph edit swallowed the
# following blank line. Same probe run, same runtime as above.
tree-sitter-md = "0.5.4"
tree-sitter-css = "0.25.0"
tree-sitter-yaml = "0.7.2"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-language = "0.1"
toml = "0.8"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
xmltree = "0.12"
serde_json = { version = "1.0", features = ["preserve_order"] }  # J1 (2026-11-08): JSON-edit re-serialiserar — nyckelordningen måste överleva (BTreeMap-sortering vore diff-brus över hela filen)
rayon = "1.10"
rusqlite = { version = "0.32", features = ["bundled"] }

# AI dependencies (optional)
candle-core = { version = "0.9", optional = true }
candle-nn = { version = "0.9", optional = true }
candle-transformers = { version = "0.9", optional = true }
hf-hub = { version = "0.3", optional = true }
ureq = { version = "2", optional = true }
tokenizers = { version = "0.21", optional = true }

# MCP server dependencies (optional)
hyper = { version = "1.0", optional = true }
axum = { version = "0.7", optional = true }
tokio-stream = { version = "0.1", optional = true, features = ["net"] }
tower-http = { version = "0.3", optional = true, features = ["add-extension"] }
tiktoken-rs = "0.12.0"
secrets_scanner = "0.2.3"
md5 = "0.8.1"
fastrand = { version = "2", optional = true }

[dev-dependencies]
tempfile = "3"
tower = "0.5"
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }

[features]
default = ["modernbert", "mcp"]
modernbert = ["candle-core", "candle-nn", "candle-transformers", "hf-hub", "ureq", "tokenizers"]
mamba = ["candle-core", "candle-nn", "candle-transformers", "hf-hub", "ureq", "tokenizers", "dep:fastrand"]
mcp = ["dep:reqwest", "hyper", "axum", "tokio-stream", "tower-http"]
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]
all = ["modernbert", "mcp", "cuda", "metal", "mamba"]

# Still not tree-sitter, and why:
#   xml  — custom parser (xmltree); no grammar added yet.
#   json — serde + json_semantic_edit (J1). That path navigates by MAPPING KEY
#          (paths like "namn"), not by numeric index; swapping to
#          tree-sitter-json changes every JSON path and must be done together
#          with that function, not before it.
# css/json used to be disabled here citing "version conflicts". A probe against
# tree-sitter 0.26.13 (2026-11-10) shows neither pulls a second runtime, so
# that reason no longer holds — css is now enabled above.
# tree-sitter-xml = "0.7"
# tree-sitter-json = "0.24"
