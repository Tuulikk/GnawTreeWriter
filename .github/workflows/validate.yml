name: Validate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Run unit tests
        run: cargo test

      - name: Run clippy
        run: cargo clippy -- -D warnings

      # Motor2 regression (bug report 2026-10-05): default AND mamba both
      # have modernbert on — only this config catches feature-gate holes
      # in the no-default-features build (path-dependents like motor2-gtw).
      - name: Check no-default-features build
        run: cargo check --no-default-features --all-targets
