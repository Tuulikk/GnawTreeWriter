name: Validate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      # Skill drift guard: the Crush .skill package and the Codex symlink must
      # both derive from the canonical SKILL.md. A stale package once shipped
      # v0.9.2 instructions to Crush while the repo was at 0.25.x — silent,
      # because nothing compared them. This makes that failure loud.
      - name: Check skill package is in sync
        run: scripts/pack-skill.sh --check

      - name: Run unit tests
        run: cargo test

      - name: Run clippy
        run: cargo clippy -- -D warnings

      # Motor2 regression (bug report 2026-10-05): default AND mamba both
      # have modernbert on — only this config catches feature-gate holes
      # in the no-default-features build (path-dependents like motor2-gtw).
      - name: Check no-default-features build
        run: cargo check --no-default-features --all-targets

      # The committed code-index.md is a GENERATED artifact with a content
      # stamp; `--check` re-renders and compares (DB-free). The gate existed
      # but nothing ran it, so the artifact went stale unnoticed (2026-11-11:
      # it failed on a clean master). A gate nobody walks through is decoration.
      - name: Check code-index.md is fresh
        run: cargo run --quiet -- code-index . --check
