# Built-in rules for GnawTreeWriter lint.
#
# These are original formulations of well-known anti-patterns, written for
# GTW's pattern engine (structural AST matching). They are not copied from
# semgrep-rules or any other rule set — only the existence of the anti-patterns
# themselves is common knowledge in the linting community.
#
# Format: code patterns with $X / $Y placeholders. `language` is required.

rules:
  # ── Rust ─────────────────────────────────────────────────────

  # unwrap() panics on Err/None unless handled
  - id: rust_unwrap
    language: rust
    severity: warning
    message: "unwrap() panics on Err/None — consider handling the error case"
    pattern: "$X.unwrap()"

  # Self-assignment (a = a) is almost always a bug
  - id: rust_self_assignment
    language: rust
    severity: error
    message: "Self-assignment (a = a) — likely a bug"
    pattern: "$X = $X"

  # todo!() / unimplemented!() left in shipped code
  - id: rust_todo_in_place
    language: rust
    severity: warning
    message: "todo!/unimplemented! left in code — finish or remove it"
    pattern: "todo!()"

  # panic!() in a library path is a blunt crash
  - id: rust_panic
    language: rust
    severity: info
    message: "panic!() aborts the process — prefer returning a Result/error"
    pattern: "panic!($X)"

  # unsafe blocks are a safety warning sign
  - id: rust_unsafe
    language: rust
    severity: warning
    message: "unsafe block — audit memory/pointer invariants carefully"
    pattern: "unsafe { $X }"

  # `let _ = expr` discards the result silently
  - id: rust_discard_result
    language: rust
    severity: info
    message: "`let _ = expr` discards a value/error — handle it explicitly if it matters"
    pattern: "let _ = $X;"

  # Compare to () / unit in a way that usually signals a mistake
  - id: rust_redundant_return
    language: rust
    severity: info
    message: "Redundant trailing return at the end of a block"
    pattern: "return $X;\nreturn $X;"

  # Loop over a Vec with immediate collect — probably unnecessary allocation
  - id: rust_collect_chain
    language: rust
    severity: info
    message: "collect() right after iter() — verify this allocation is needed"
    pattern: "$X.iter().collect()"

  # Hardcoded magic number in a comparison or constructor
  - id: rust_magic_number
    language: rust
    severity: info
    message: "Magic number — consider naming it as a constant"
    pattern: "let $X = 42"

  # Unnecessary clone on a string slice
  - id: rust_slice_clone
    language: rust
    severity: info
    message: "Unnecessary .to_string() or .clone() on a &str"
    pattern: "($X).to_string()"

  # ── Python ───────────────────────────────────────────────────

  # Bare except: without an exception type swallows everything
  - id: py_bare_except
    language: python
    severity: warning
    message: "Bare except: silently swallows all exceptions — narrow the exception type"
    pattern: |
      except:
          pass

  # eval() of dynamic input is a code-injection risk
  - id: py_eval
    language: python
    severity: warning
    message: "eval() of dynamic input is a security risk"
    pattern: "eval($X)"

  # exec() of dynamic input is a code-injection risk (variant of eval)
  - id: py_exec
    language: python
    severity: warning
    message: "exec() of dynamic input is a security risk"
    pattern: "exec($X)"

  # Comparing with None using == instead of `is`
  - id: py_none_equality
    language: python
    severity: warning
    message: "Use 'is None' / 'is not None' instead of == / != None"
    pattern: "$X == None"

  # Print statement left behind in application code
  - id: py_print_left
    language: python
    severity: info
    message: "print() left in code — consider logging instead"
    pattern: "print($X)"

  - id: py_raise_generic
    language: python
    severity: warning
    message: "Raising bare Exception — use a more specific exception type"
    pattern: "raise Exception($X)"

  - id: py_assert_false
    language: python
    severity: warning
    message: "assert False is unreachable — prefer raising an exception"
    pattern: "assert False"

  - id: py_import_star
    language: python
    severity: info
    message: "from X import * — pollutes namespace and hides dependencies"
    pattern: "import $X"

  - id: py_bare_raise
    language: python
    severity: warning
    message: "Bare raise without context — re-raise inside except with traceback"
    pattern: "raise"

  - id: py_comprehension
    language: python
    severity: info
    message: "List comprehension in a non-comprehension scope — verify readability"
    pattern: "[x for $X in $Y if $Z]"

  - id: py_string_concat
    language: python
    severity: info
    message: "String concatenation with + — use f-strings or join()"
    pattern: "$X + $Y"

  # ── JavaScript / TypeScript ──────────────────────────────────

  # console.log left in shipped code
  - id: js_console_log
    language: javascript
    severity: info
    message: "console.log left in code — remove or gate behind a flag"
    pattern: "console.log($X)"

  # Loose equality == instead of strict ===
  - id: js_loose_equality
    language: javascript
    severity: warning
    message: "Use strict equality === / !== instead of == / !="
    pattern: "$X == $Y"

  # eval() carries code-injection risk
  - id: js_eval
    language: javascript
    severity: warning
    message: "eval() executes dynamic code — avoid unless strictly necessary"
    pattern: "eval($X)"

  # Function declared with `var` instead of const/let (stale pattern)
  - id: js_function_var
    language: javascript
    severity: info
    message: "Prefer const/let over var"
    pattern: "var $X = function ($Y) { $Z }"

  # Setting innerHTML from variable content can enable XSS
  - id: js_inner_html
    language: javascript
    severity: warning
    message: "Setting innerHTML from variable content may enable XSS"
    pattern: "$X.innerHTML = $Y"

  - id: js_alert
    language: javascript
    severity: info
    message: "alert() left in code — remove before shipping"
    pattern: "alert($X)"

  - id: js_prompt
    language: javascript
    severity: info
    message: "prompt() left in code — remove or replace with a proper input"
    pattern: "prompt($X)"

  - id: js_synchronous_xhr
    language: javascript
    severity: warning
    message: "Synchronous XMLHttpRequest blocks the main thread — use async/fetch"
    pattern: "XMLHttpRequest()"

  - id: js_addEventListener
    language: javascript
    severity: info
    message: "addEventListener without a corresponding removeEventListener can leak memory"
    pattern: "$X.addEventListener($Y, $Z)"

  - id: js_setTimeout_string
    language: javascript
    severity: warning
    message: "setTimeout with a string argument is eval-like — use a function reference"
    pattern: "setTimeout(\"$X\", $Y)"

  - id: js_for_in
    language: javascript
    severity: warning
    message: "for-in on object iterates over all enumerable properties including inherited ones — use Object.keys()"
    pattern: "for ($X in $Y) { $Z }"

  # ── TypeScript ───────────────────────────────────────────────

  # Any left in a typed codebase weakens type safety
  - id: ts_any_cast
    language: typescript
    severity: info
    message: "'as any' bypasses type checking — prefer a precise type"
    pattern: "$X as any"

  # Non-null assertion on a possibly-undefined value
  - id: ts_non_null_assert
    language: typescript
    severity: warning
    message: "Non-null assertion (!) — handle the null/undefined case"
    pattern: "$X!"

  - id: ts_unknown
    language: typescript
    severity: info
    message: "Using 'unknown' instead of 'any' in catch blocks"
    pattern: "catch ($X: unknown) { $Y }"

  - id: ts_undefined_check
    language: typescript
    severity: warning
    message: "Comparing with == undefined instead of === undefined"
    pattern: "$X == undefined"

  - id: ts_enum_numeric
    language: typescript
    severity: info
    message: "Numeric enum — prefer string enums or union types"
    pattern: "enum $X { $Y = 1 }"

  - id: ts_no_implicit_any
    language: typescript
    severity: warning
    message: "Implicit 'any' type annotation — add a type annotation"
    pattern: "($X: any) => $Y"

  - id: ts_string_index
    language: typescript
    severity: info
    message: "Indexing a Record with a string key — consider a typed key"
    pattern: "$X[$Y as keyof $X]"

  - id: ts_type_assertion
    language: typescript
    severity: warning
    message: "Type assertion with 'as unknown as' — prefer a type guard"
    pattern: "$X as unknown as $Y"

  - id: ts_unused_import
    language: typescript
    severity: info
    message: "Import may be unused — verify all symbols are consumed"
    pattern: "import { $X } from \"$Y\""

  # ── Go ───────────────────────────────────────────────────────

  - id: go_self_assignment
    language: go
    severity: error
    message: "Self-assignment (x = x) — likely a bug"
    pattern: "$X = $X"

  - id: go_discard_return
    language: go
    severity: info
    message: "Discarded return value — handle the result or explicit underscore"
    pattern: "_ = $X"

  - id: go_panic
    language: go
    severity: warning
    message: "panic() aborts the goroutine and panics; prefer returning errors"
    pattern: "panic($X)"

  - id: go_os_exit
    language: go
    severity: warning
    message: "os.Exit() bypasses defers — consider returning instead"
    pattern: "os.Exit($X)"

  - id: go_fmt_println
    language: go
    severity: info
    message: "fmt.Println() left in code — use structured logging or remove"
    pattern: "fmt.Println($X)"

  - id: go_defer_call
    language: go
    severity: info
    message: "defer in non-automatically-closing code (no loop guard, no limit)"
    pattern: "defer $X()"

  - id: go_make_empty
    language: go
    severity: warning
    message: "make() with zero capacity — likely missing a size hint"
    pattern: "make($X)"

  - id: go_infinite_loop
    language: go
    severity: warning
    message: "for-range loop with empty body or bare for {} — verify intention"
    pattern: "for { $X }"

  - id: go_error_assigned_unused
    language: go
    severity: info
    message: "Error assigned but only partially handled — consider full check"
    pattern: "_ = $X()"

  # ── Java ─────────────────────────────────────────────────────

  - id: java_self_assignment
    language: java
    severity: error
    message: "Self-assignment (x = x) — likely a bug"
    pattern: "$X = $X"

  - id: java_broad_catch
    language: java
    severity: warning
    message: "Catching all Exceptions silently hides bugs — narrow the type"
    pattern: "catch (Exception $X) { $Y }"

  - id: java_system_out
    language: java
    severity: info
    message: "System.out.println left in code — use a logger"
    pattern: "System.out.println($X)"

  - id: java_throw_new
    language: java
    severity: warning
    message: "throw new RuntimeException — avoid raw RuntimeException, use specific types"
    pattern: "throw new RuntimeException($X)"

  - id: java_parse_int
    language: java
    severity: info
    message: "Integer.parseInt() throws on invalid input — catch NumberFormatException or use safer alternative"
    pattern: "Integer.parseInt($X)"

  - id: java_new_object
    language: java
    severity: info
    message: "Unnecessary Object allocation"
    pattern: "new $X()"

  - id: java_null_compare
    language: java
    severity: warning
    message: "Comparing reference with null using == instead of .equals()"
    pattern: "$X == null"

  - id: java_synchronized
    language: java
    severity: info
    message: "synchronized block — verify lock scope and deadlock safety"
    pattern: "synchronized ($X)"

  - id: java_return_null
    language: java
    severity: info
    message: "Returning null — consider Optional or an empty default"
    pattern: "return null"

  # ── C ────────────────────────────────────────────────────────

  - id: c_self_assignment
    language: c
    severity: error
    message: "Self-assignment (x = x) — likely a bug"
    pattern: "$X = $X"

  - id: c_malloc_unchecked
    language: c
    severity: warning
    message: "malloc() result not checked for NULL — add a check"
    pattern: "$X = malloc($Y)"

  - id: c_strcpy_unbounded
    language: c
    severity: error
    message: "strcpy() with unbounded source — use strncpy or strlcpy"
    pattern: "strcpy($X, $Y)"

  - id: c_sprintf
    language: c
    severity: warning
    message: "sprintf() has no length bound — prefer snprintf()"
    pattern: "sprintf($X, $Y)"

  - id: c_free_null_check
    language: c
    severity: info
    message: "Freeing a pointer without checking for NULL first"
    pattern: "free($X)"

  - id: c_goto
    language: c
    severity: info
    message: "goto statement — consider structured control flow"
    pattern: "goto $X"

  - id: c_printf_format
    language: c
    severity: info
    message: "printf() — verify format string is not user-controlled"
    pattern: "printf($X)"

  - id: c_char_ptr
    language: c
    severity: info
    message: "Using raw char* — consider const-correctness and bounds"
    pattern: "char *$X"

  - id: c_global mutable
    language: c
    severity: warning
    message: "File-scope mutable static variable — thread-unsafe"
    pattern: "static int $X"

  - id: c_realloc
    language: c
    severity: warning
    message: "realloc() result not checked for NULL — handle reallocation failure"
    pattern: "$X = realloc($Y, $Z)"